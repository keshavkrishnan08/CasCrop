project:
  name: cascrop
  seed: 42

training:
  epochs: 200
  patience: 20
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: AdamW
  scheduler: CosineAnnealingWarmRestarts
  scheduler_T_0: 50
  gradient_clip_norm: 1.0
  disentangle_warmup_epochs: 10
  discriminator_steps_per_encoder: 5

model:
  latent_dim: 64
  hidden_dim: 128
  ecmp_heads: 4
  ecmp_layers: 2
  shock_embed_dim: 8
  dropout: 0.3
  disentangle_lambda: 0.1
  cause_loss_weight: 0.3
  biophysical_input_dim: 30
  economic_input_dim: 15
  historical_input_dim: 10
  num_cause_classes: 6

loss:
  waste_loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  cause_loss: cross_entropy

data:
  graph_k_neighbors: 20
  feature_lag_weeks: 1
  train_years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]
  val_years: [2020, 2021]
  test_years: [2022, 2023, 2024]
  commodities: ["CORN", "SOYBEANS", "WHEAT"]
  waste_threshold: 10000

graph:
  alpha_init: 0.333
  beta_init: 0.333
  gamma_init: 0.333
  sparsify_top_k: 20
  distance_sigma: auto

seeds: [42, 123, 456, 789, 1024]

evaluation:
  bootstrap_n: 10000
  confidence_level: 0.95
  delong_test: true
  mcnemar_test: true

paths:
  raw_data: data/raw
  processed_data: data/processed
  splits: data/splits
  graphs: data/graphs
  checkpoints: checkpoints
  logs: logs
  results: results
